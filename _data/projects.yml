# Schema (mirrors _data/publications_domestic.yml):
# - year: 2026
#   projects:
#     - title: 'Project title (프로젝트명)'
#       role: 'PI'   # or 'Co-I' — see the glossary note on the Project page
#       agency: 'Funding agency'
#       period: '2026.01 – 2027.12'
#
# Grouped by year (the project's most recent/end year), newest first — same
# ordering convention as the publications data files.
#
# Consolidated from the 참여확인증명서 (participation certificate): each row
# in that certificate is one annual/role installment of a multi-year grant,
# so installments belonging to the same underlying project (same title
# across "1차/2차/...", "(N/M)", or a renamed continuation) have been merged
# into a single entry spanning the full participation period. Two payroll
# bookkeeping lines ("학생인건비 ...") and one internal lab-support line item
# ("연구소지원 과제") were excluded as they are not distinct research projects.

