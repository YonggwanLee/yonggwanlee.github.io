# Archive of student group-presentation materials, by course and semester.
# Only courses that actually have group presentations belong here (e.g. not
# Computer Programming) — the full list of courses taught is on the PI page.
# Each course gets its own page under education/ (see navigation.yml).
#
# Schema:
# - key: 'satellite-images'                # matches a page's `course_key`
#   course: 'Course title (과목명)'
#   semesters:
#     - term: 'Spring 2025'
#       presentations:
#         - title: '발표 제목'
#           presenters: '발표자 이름'
#           link: 'https://drive.google.com/...'   # omit if none
#           # thumbnail: usually don't set this — if `link` is a
#           # drive.google.com/file/d/... URL, the page auto-derives a
#           # first-page thumbnail from Google Drive's own thumbnail
#           # endpoint (nothing is stored in this repo). Only set
#           # `thumbnail:` explicitly to override that (e.g. a local
#           # /assets/img/... path, or for a non-Drive link).

- key: 'satellite-images'
  course: 'Application Engineering of Satellite Images (위성영상 활용공학)'
  semesters:
    - term: 'Spring 2026'
      presentations:
        - title: 'MODIS NDVI 기반 산불피해지 회복 경향 분석'
          presenters: '고보화, 노현승, 양태희'
          link: 'https://drive.google.com/file/d/1oXkUj9e7BP82M6YuACj4Rll8O0ndHjH5/view?usp=sharing'
        - title: '새만금 간척지의 시계열 원격탐사 분석'
          presenters: '이정화, 임채민, 조혜원'
          link: 'https://drive.google.com/file/d/19kBxmVdSF7zzDDZsxTzxRMi_nK_yNME4/view?usp=sharing'
        - title: '위성 데이터를 활용한 러시아-우크라이나 전쟁 지역 환경 변화 분석'
          presenters: '김현호, 문서연, 최지윤'
          link: 'https://drive.google.com/file/d/1DGvNwDmzbU9pRS0Fwp4BzcV-ljdvY8hZ/view?usp=drive_link'
        - title: '위성 영상을 활용한 파나마 운하 수면적 변화 분석과 물류 통행량 영향 검토'
          presenters: '김민성, 노승현, 박해성'
          link: 'https://drive.google.com/file/d/1gxJRi2Ky071EhwKyYHocQ-GNixLGbuX0/view?usp=drive_link'
        - title: '식생지수와 지역안정성의 관계'
