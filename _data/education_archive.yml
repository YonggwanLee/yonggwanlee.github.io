          link: 'https://drive.google.com/file/d/1lYwIciNsySV66QiywlFamtDeahQUCysl/view?usp=drive_link'
        - title: 'MODIS VHI와 SPI 시차분석을 활용한 식생 가뭄 조기경보 가능성 평가: 강릉 지역 사례'
