          link: 'https://drive.google.com/file/d/12V-Zh4tTpbklU0gZuPVF_z542DPhhPao/view?usp=drive_link'
    - term: 'Spring 2024'
      presentations:
        - title: 'MODIS 분석을 통한 대한민국 봄철 가뭄 분석: NDVI와 PDSI의 상관관계를 중점으로'
          presenters: '김가영, 김민정, 양윤영'
          link: 'https://drive.google.com/file/d/1IEYqGOGEXnVyWlHe-JaW1YpMNAq_tP2c/view?usp=sharing'
        - title: '강우량과 NDVI 지수를 활용한 북한지역 가뭄분석'
          presenters: '백민기, 구도연, 박지수'
          link: 'https://drive.google.com/file/d/1HBdcznYlf5kvbERwmWoU7LWlmvGSmD7K/view?usp=sharing'
        - title: '위성 영상을 활용한 아랄해 사막화 현상 및 주변 지역 분석'
          presenters: '심용수, 전다은, 장예진'
          link: 'https://drive.google.com/file/d/1yMdgLR6tP9EyX_qRi1sy94k5QF7WtO3r/view?usp=sharing'
        - title: '국내 주요 도시 분석 LST, NDVI, ALBEDO'
          presenters: '김승훈, 유덕현, 이지원'
          link: 'https://drive.google.com/file/d/12DG6vpJVwVtRFaTjp2mzYOGsUGy-kpX8/view?usp=sharing'
        - title: '지표면온도(LST)와 정규식생지수(NDVI)를 통한 2022년~2023년 과일 생산량 감소 원인 분석'
